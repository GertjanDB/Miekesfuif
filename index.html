<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Mieke's Fuif</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Shrikhand&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #f6edd9;
            --ink: #4a2418;
            --orange: #f15a12;
            --pink: #e21878;
            --purple: #5c2a78;
            --peach: #f6c9a4;
            --teal: #1a9b8e;
        }

        * { box-sizing: border-box; }

        [hidden] { display: none !important; }

        html, body {
            margin: 0;
            min-height: 100%;
        }

        body {
            font-family: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at 12% 18%, #ffd7a8 0 18px, transparent 19px),
                radial-gradient(circle at 88% 8%, #f7b4d8 0 14px, transparent 15px),
                #f3d7b0;
        }

        .poster {
            position: relative;
            width: min(440px, calc(100% - 16px));
            min-height: calc(100dvh - 16px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
            margin: 8px auto;
            padding: max(18px, env(safe-area-inset-top)) 16px max(22px, env(safe-area-inset-bottom));
            overflow: hidden;
            background: var(--cream);
            border: 7px solid #5c3317;
            border-radius: 28px;
            box-shadow: 0 10px 0 rgba(92, 51, 23, 0.18);
        }

        .waves {
            position: absolute;
            left: -8%;
            width: 116%;
            height: 92px;
            pointer-events: none;
        }

        .waves.top { top: -18px; }
        .waves.bottom { bottom: -28px; transform: scaleY(-1); }

        .star {
            position: absolute;
            color: var(--orange);
            font-size: 18px;
            line-height: 1;
            pointer-events: none;
        }

        .star.pink { color: var(--pink); }
        .star.teal { color: var(--teal); }
        .star.purple { color: var(--purple); }
        .s1 { top: 18px; left: 18px; }
        .s2 { top: 72px; right: 22px; font-size: 14px; }
        .s3 { top: 128px; left: 22px; font-size: 12px; }
        .s4 { bottom: 120px; right: 18px; }
        .s5 { bottom: 78px; left: 28px; font-size: 14px; }

        .sheet {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: min(100%, 340px);
            margin: 0 auto;
        }

        .ball {
            width: 46px;
            height: 46px;
            margin-top: 4px;
            border-radius: 50%;
            background:
                linear-gradient(90deg, rgba(255,255,255,.55) 0 2px, transparent 2px),
                linear-gradient(rgba(255,255,255,.45) 0 2px, transparent 2px),
                conic-gradient(from 20deg, #f4f7fb, #9aa3ad, #ffffff, #6d7680, #e8eef5, #b7c0c8, #ffffff, #8b949e);
            background-size: 11px 11px, 11px 11px, auto;
            box-shadow:
                inset -10px -12px 0 rgba(40, 40, 50, 0.18),
                0 8px 0 rgba(92, 51, 23, 0.12);
        }

        .ball::before {
            content: "";
            display: block;
            width: 2px;
            height: 10px;
            margin: -10px auto 0;
            background: #5c3317;
        }

        h1 {
            margin: 8px 0 0;
            font-family: Shrikhand, "Arial Rounded MT Bold", cursive;
            font-size: clamp(36px, 10vw, 48px);
            font-weight: 400;
            line-height: 0.9;
            text-align: center;
            color: var(--orange);
            -webkit-text-stroke: 5px var(--pink);
            paint-order: stroke fill;
            text-shadow: 3px 4px 0 #7a2d86;
        }

        h1 span {
            display: block;
            color: var(--pink);
            -webkit-text-stroke: 5px var(--orange);
        }

        .amount {
            display: grid;
            grid-template-columns: 72px minmax(0, 1fr) 72px;
            gap: 6px;
            align-items: center;
            width: 100%;
            margin-top: 10px;
        }

        .side {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .step,
        .extra {
            border: 3px solid var(--purple);
            background: var(--peach);
            color: var(--purple);
            font: inherit;
            line-height: 1;
            cursor: pointer;
            touch-action: manipulation;
            text-decoration: none;
        }

        .step {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            font-size: 32px;
        }

        .extra {
            width: 100%;
            height: 36px;
            border-radius: 999px;
            font-size: 15px;
        }

        .step:active,
        .extra:active { transform: translateY(2px); }

        .medal {
            position: relative;
            width: min(100%, 128px);
            margin: 0 auto;
            aspect-ratio: 1;
        }

        .medal svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .medal label {
            position: absolute;
            inset: 16%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #bedrag {
            width: 100%;
            border: 0;
            padding: 0;
            background: transparent;
            color: var(--ink);
            font-family: Shrikhand, cursive;
            font-size: clamp(18px, 5.1vw, 26px);
            line-height: 1;
            text-align: center;
            text-decoration: none;
            -webkit-appearance: none;
            appearance: none;
        }

        #bedrag:focus { outline: none; }

        .mededeling {
            display: block;
            width: 100%;
            margin: 8px 0 0;
            border: 0;
            border-bottom: 2px dashed var(--purple);
            padding: 4px 8px 6px;
            background: transparent;
            color: var(--purple);
            font-family: "Trebuchet MS", sans-serif;
            font-size: 16px;
            font-weight: 700;
            line-height: 1.2;
            text-align: center;
            text-decoration: none;
            -webkit-appearance: none;
            appearance: none;
        }

        .hint {
            min-height: 1.1em;
            margin: 8px 0 0;
            color: var(--pink);
            font-family: "Trebuchet MS", sans-serif;
            font-size: 14px;
            font-weight: 700;
            text-align: center;
        }

        .qr-card {
            display: grid;
            width: min(100%, 248px);
            margin-top: 4px;
            padding: 8px;
            aspect-ratio: 1;
            background: #fff;
            border: 4px solid #5c3317;
            border-radius: 24px;
            box-shadow: 6px 6px 0 rgba(226, 24, 120, 0.18);
        }

        .qr-card canvas,
        .qr-empty {
            grid-area: 1 / 1;
        }

        .qr-card canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        .qr-empty {
            display: grid;
            place-items: center;
            margin: 0;
            padding: 12px;
            color: #8a6248;
            font-family: "Trebuchet MS", sans-serif;
            font-size: 16px;
            text-align: center;
        }

        .pay {
            width: 100%;
            height: 64px;
            margin-top: 14px;
            border: 3px solid var(--purple);
            border-radius: 999px;
            background: linear-gradient(#ff7a2f, var(--orange));
            color: #fffaf3;
            font: inherit;
            font-size: 28px;
            letter-spacing: 0.04em;
            text-shadow: 0 2px 0 rgba(92, 42, 120, 0.35);
            box-shadow: 0 5px 0 var(--purple);
            cursor: pointer;
            touch-action: manipulation;
        }

        .pay:active:not(:disabled) {
            transform: translateY(3px);
            box-shadow: 0 2px 0 var(--purple);
        }

        .pay:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .pay:focus-visible,
        .step:focus-visible,
        .extra:focus-visible,
        #bedrag:focus-visible,
        #tekst:focus-visible {
            outline: 3px solid var(--teal);
            outline-offset: 3px;
        }

        .sr {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
        }
    </style>
</head>
<body>
    <main class="poster">
        <svg class="waves top" viewBox="0 0 400 90" preserveAspectRatio="none" aria-hidden="true">
            <path fill="#1a9b8e" d="M0 40 C 50 10, 80 70, 140 42 C 190 20, 220 8, 270 36 C 320 64, 350 20, 400 34 L400 0 L0 0 Z"/>
            <path fill="#e21878" d="M0 58 C 40 30, 90 78, 150 52 C 210 26, 240 18, 300 48 C 350 72, 370 40, 400 50 L400 0 L0 0 Z" opacity=".85"/>
            <path fill="#f15a12" d="M0 28 C 60 58, 100 8, 170 30 C 230 48, 260 70, 330 28 C 360 12, 380 24, 400 20 L400 0 L0 0 Z" opacity=".9"/>
        </svg>
        <svg class="waves bottom" viewBox="0 0 400 90" preserveAspectRatio="none" aria-hidden="true">
            <path fill="#7a3cff" d="M0 50 C 60 20, 110 80, 180 46 C 240 18, 280 24, 340 58 C 370 74, 390 40, 400 48 L400 0 L0 0 Z"/>
            <path fill="#1a9b8e" d="M0 34 C 50 64, 100 16, 160 40 C 230 68, 270 20, 340 42 C 370 54, 385 30, 400 36 L400 0 L0 0 Z"/>
            <path fill="#f15a12" d="M0 18 C 70 48, 120 4, 190 26 C 250 46, 300 8, 400 28 L400 0 L0 0 Z"/>
        </svg>
        <span class="star s1" aria-hidden="true">✦</span>
        <span class="star pink s2" aria-hidden="true">✦</span>
        <span class="star teal s3" aria-hidden="true">✦</span>
        <span class="star purple s4" aria-hidden="true">✦</span>
        <span class="star s5" aria-hidden="true">✦</span>

        <div class="sheet">
            <div class="ball" aria-hidden="true"></div>
            <h1>Mieke's<span>Fuif</span></h1>

            <div class="amount">
                <div class="side">
                    <button type="button" class="step" id="down" aria-label="1,25 euro minder">−</button>
                    <button type="button" class="extra" id="reset">reset</button>
                </div>
                <div class="medal">
                    <svg viewBox="0 0 200 200" aria-hidden="true">
                        <g fill="#5c2a78">
                            <circle cx="100" cy="16" r="16"/>
                            <circle cx="142" cy="28" r="16"/>
                            <circle cx="172" cy="58" r="16"/>
                            <circle cx="184" cy="100" r="16"/>
                            <circle cx="172" cy="142" r="16"/>
                            <circle cx="142" cy="172" r="16"/>
                            <circle cx="100" cy="184" r="16"/>
                            <circle cx="58" cy="172" r="16"/>
                            <circle cx="28" cy="142" r="16"/>
                            <circle cx="16" cy="100" r="16"/>
                            <circle cx="28" cy="58" r="16"/>
                            <circle cx="58" cy="28" r="16"/>
                        </g>
                        <circle cx="100" cy="100" r="78" fill="#f6c9a4" stroke="#5c2a78" stroke-width="6"/>
                    </svg>
                    <label>
                        <input id="bedrag" inputmode="decimal" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" maxlength="12" aria-label="Bedrag in euro">
                    </label>
                </div>
                <div class="side">
                    <button type="button" class="step" id="up" aria-label="1,25 euro meer">+</button>
                    <button type="button" class="extra" id="plus15">€15</button>
                </div>
            </div>
            <input id="tekst" class="mededeling" maxlength="140" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Mededeling">
            <p class="hint" id="hint"></p>

            <div class="qr-card" id="qr-card">
                <canvas id="qr" role="img"></canvas>
                <p class="qr-empty" id="qr-empty" hidden>Vul een geldig bedrag in.</p>
            </div>

            <button type="button" class="pay" id="betaald">Betaald</button>
        </div>
    </main>
    <p class="sr" id="status" aria-live="polite"></p>

    <script src="qrcode.js"></script>
    <script>
        const NAME = "Jonas De Bot";
        const IBAN = "BE64734055410752";
        const BASIS = "Miekesfuif";
        const KEY = "miekesfuif-qr-v1";
        const STEP_CENTS = 125;
        const ADD_CENTS = 1500;
        const MAX_CENTS = 99999999;

        const bedrag = document.getElementById("bedrag");
        const tekst = document.getElementById("tekst");
        const hint = document.getElementById("hint");
        const canvas = document.getElementById("qr");
        const empty = document.getElementById("qr-empty");
        const betaald = document.getElementById("betaald");
        const status = document.getElementById("status");

        qrcode.stringToBytes = qrcode.stringToBytesFuncs["UTF-8"];

        const state = load();
        let lockUntil = 0;

        bedrag.value = "-";
        tekst.value = state.note;
        render();
        document.fonts.ready.then(() => render());
        window.addEventListener("resize", () => fitAmount());

        bedrag.addEventListener("pointerdown", clearDash);
        bedrag.addEventListener("focus", () => {
            setTimeout(clearDash, 0);
        });

        bedrag.addEventListener("input", () => {
            render();
        });

        bedrag.addEventListener("blur", () => {
            const cents = parseAmount(bedrag.value);
            bedrag.value = cents == null ? "-" : formatCents(cents);
            render();
        });

        tekst.addEventListener("input", () => {
            state.note = tekst.value;
            save();
            render();
        });

        document.getElementById("down").addEventListener("click", () => step(-1));
        document.getElementById("up").addEventListener("click", () => step(1));
        document.getElementById("plus15").addEventListener("click", addFifteen);
        document.getElementById("reset").addEventListener("click", resetAmount);

        betaald.addEventListener("click", () => {
            const now = Date.now();
            if (now < lockUntil) return;
            const cents = parseAmount(bedrag.value);
            if (cents == null) return;
            lockUntil = now + 350;
            const paid = message();
            tekst.value = bumpMessage(paid);
            state.note = tekst.value;
            bedrag.value = "-";
            save();
            render();
            status.textContent = "Betaling genoteerd. Mededeling is nu " + state.note + ".";
        });

        function clearDash() {
            if (bedrag.value.trim() !== "-") return;
            bedrag.value = "";
            render();
        }

        function step(delta) {
            const current = parseAmount(bedrag.value);
            if (current == null) {
                bedrag.value = delta > 0 ? formatCents(STEP_CENTS) : "-";
            } else {
                const next = current + delta * STEP_CENTS;
                bedrag.value = next < 1 ? "-" : formatCents(Math.min(MAX_CENTS, next));
            }
            render();
        }

        function addFifteen() {
            const current = parseAmount(bedrag.value) || 0;
            bedrag.value = formatCents(Math.min(MAX_CENTS, current + ADD_CENTS));
            render();
        }

        function resetAmount() {
            bedrag.value = "-";
            render();
        }

        function render() {
            const cents = parseAmount(bedrag.value);
            const valid = cents != null;
            const note = message();
            fitAmount();
            const raw = bedrag.value.trim();
            hint.textContent = valid || raw === "" || raw === "-"
                ? ""
                : "Gebruik een bedrag als 15,00.";
            betaald.disabled = !valid;
            canvas.hidden = !valid;
            empty.hidden = valid;
            if (!valid) {
                canvas.removeAttribute("aria-label");
                return;
            }
            draw(payload(cents, note));
            canvas.setAttribute("aria-label", "QR-code voor " + formatCents(cents) + " euro, mededeling " + note);
        }

        function fitAmount() {
            const sample = bedrag.value.trim() || "-";
            const width = bedrag.clientWidth;
            if (!width) return;
            const probe = canvas.getContext("2d");
            bedrag.style.fontSize = "";
            let size = parseFloat(getComputedStyle(bedrag).fontSize);
            probe.font = size + "px Shrikhand, cursive";
            while (size > 13 && probe.measureText(sample).width > width - 4) {
                size -= 1;
                probe.font = size + "px Shrikhand, cursive";
            }
            bedrag.style.fontSize = size + "px";
        }

        function message() {
            return tekst.value.replace(/[\r\n]+/g, " ").trim().slice(0, 140);
        }

        function bumpMessage(text) {
            const match = text.match(/^(.*?)(\d+)$/);
            if (match && match[2].length < 10) {
                const n = Number(match[2]) + 1;
                state.next = Math.max(state.next, n);
                return (match[1] + n).slice(0, 140);
            }
            state.next += 1;
            const base = text.trim();
            return ((base ? base + " " : BASIS + " ") + state.next).slice(0, 140);
        }

        function payload(cents, note) {
            return [
                "BCD",
                "002",
                "2",
                "SCT",
                "",
                NAME,
                IBAN,
                epcAmount(cents),
                "",
                "",
                note,
            ].join("\r\n");
        }

        function epcAmount(cents) {
            const euros = Math.floor(cents / 100);
            const rem = String(cents % 100).padStart(2, "0");
            return "EUR" + euros + "." + rem;
        }

        function draw(text) {
            const qr = qrcode(0, "M");
            qr.addData(text);
            qr.make();
            const modules = qr.getModuleCount();
            const quiet = 4;
            const scale = 8;
            const size = (modules + quiet * 2) * scale;
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext("2d");
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, size, size);
            ctx.fillStyle = "#000000";
            for (let row = 0; row < modules; row += 1) {
                for (let col = 0; col < modules; col += 1) {
                    if (qr.isDark(row, col)) {
                        ctx.fillRect((col + quiet) * scale, (row + quiet) * scale, scale, scale);
                    }
                }
            }
        }

        function parseAmount(raw) {
            const source = String(raw).trim().replace(/\s/g, "").replace("€", "").replace(",", ".");
            if (!/^\d+(\.\d{0,2})?$/.test(source)) return null;
            const cents = Math.round(Number(source) * 100);
            if (!Number.isFinite(cents) || cents < 1 || cents > MAX_CENTS) return null;
            return cents;
        }

        function formatCents(cents) {
            const euros = Math.floor(cents / 100);
            const rem = String(cents % 100).padStart(2, "0");
            return euros + "," + rem;
        }

        function load() {
            const fresh = { next: 1, note: BASIS + " 1" };
            try {
                const saved = JSON.parse(localStorage.getItem(KEY) || "null");
                if (!saved) return fresh;
                const next = Number.isInteger(saved.next) && saved.next >= 1 ? saved.next : 1;
                const note = typeof saved.note === "string" && saved.note.trim()
                    ? saved.note.replace(/[\r\n]+/g, " ").trim().slice(0, 140)
                    : BASIS + " " + next;
                return { next, note };
            } catch (error) {
                /* lege start als de browser geen opslag geeft */
            }
            return fresh;
        }

        function save() {
            try {
                localStorage.setItem(KEY, JSON.stringify(state));
            } catch (error) {
                /* de pagina werkt ook zonder opslag */
            }
        }
    </script>
</body>
</html>
