<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Mieke's Fuif</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Shrikhand&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #f6edd9;
            --ink: #4a2418;
            --orange: #f15a12;
            --pink: #e21878;
            --purple: #5c2a78;
            --peach: #f6c9a4;
            --teal: #1a9b8e;
        }

        * { box-sizing: border-box; }

        [hidden] { display: none !important; }

        html, body {
            margin: 0;
            min-height: 100%;
        }

        body {
            font-family: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at 12% 18%, #ffd7a8 0 18px, transparent 19px),
                radial-gradient(circle at 88% 8%, #f7b4d8 0 14px, transparent 15px),
                #f3d7b0;
        }

        .poster {
            position: relative;
            width: min(440px, calc(100% - 16px));
            min-height: calc(100dvh - 16px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
            margin: 8px auto;
            padding: max(18px, env(safe-area-inset-top)) 16px max(22px, env(safe-area-inset-bottom));
            overflow: hidden;
            background: var(--cream);
            border: 7px solid #5c3317;
            border-radius: 28px;
            box-shadow: 0 10px 0 rgba(92, 51, 23, 0.18);
        }

        .waves {
            position: absolute;
            left: -8%;
            width: 116%;
            height: 92px;
            pointer-events: none;
        }

        .waves.top { top: -18px; }
        .waves.bottom { bottom: -28px; transform: scaleY(-1); }

        .star {
            position: absolute;
            color: var(--orange);
            font-size: 18px;
            line-height: 1;
            pointer-events: none;
        }

        .star.pink { color: var(--pink); }
        .star.teal { color: var(--teal); }
        .star.purple { color: var(--purple); }
        .s1 { top: 18px; left: 18px; }
        .s2 { top: 72px; right: 22px; font-size: 14px; }
        .s3 { top: 128px; left: 22px; font-size: 12px; }
        .s4 { bottom: 120px; right: 18px; }
        .s5 { bottom: 78px; left: 28px; font-size: 14px; }

        .sheet {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: min(100%, 340px);
            margin: 0 auto;
        }

        .ball {
            width: 46px;
            height: 46px;
            margin-top: 4px;
            border-radius: 50%;
            background:
                linear-gradient(90deg, rgba(255,255,255,.55) 0 2px, transparent 2px),
                linear-gradient(rgba(255,255,255,.45) 0 2px, transparent 2px),
                conic-gradient(from 20deg, #f4f7fb, #9aa3ad, #ffffff, #6d7680, #e8eef5, #b7c0c8, #ffffff, #8b949e);
            background-size: 11px 11px, 11px 11px, auto;
            box-shadow:
                inset -10px -12px 0 rgba(40, 40, 50, 0.18),
                0 8px 0 rgba(92, 51, 23, 0.12);
        }

        .ball::before {
            content: "";
            display: block;
            width: 2px;
            height: 10px;
            margin: -10px auto 0;
            background: #5c3317;
        }

        .bonnen {
            display: grid;
            gap: 10px;
            width: 100%;
            margin-top: 12px;
        }

        .bon-rij {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 7px;
        }

        .bon {
            --c: #2f8fe0;
            --edge: #155a9c;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 58px;
            padding: 0;
            border: 0;
            border-radius: 7px;
            background:
                radial-gradient(circle at 0 50%, transparent 7px, var(--c) 7.5px) left / 51% 100% no-repeat,
                radial-gradient(circle at 100% 50%, transparent 7px, var(--c) 7.5px) right / 51% 100% no-repeat;
            color: #fff;
            font: inherit;
            line-height: 1;
            text-shadow: 0 2px 0 var(--edge);
            filter: drop-shadow(0 3px 0 var(--edge));
            transform: rotate(-3deg);
            cursor: pointer;
            touch-action: manipulation;
        }

        .bon:nth-child(even) { transform: rotate(2deg); }

        .bon::after {
            content: "";
            position: absolute;
            inset: 5px 11px;
            border: 2px dashed rgba(255, 255, 255, 0.55);
            border-radius: 4px;
            pointer-events: none;
        }

        .bon.rood {
            --c: #d8262e;
            --edge: #8e1218;
        }

        .bon b {
            font-size: 26px;
            font-weight: 400;
        }

        .bon small {
            margin-top: 2px;
            font-family: "Trebuchet MS", sans-serif;
            font-size: 11px;
            font-weight: 700;
        }

        .bon:active {
            filter: drop-shadow(0 1px 0 var(--edge));
            translate: 0 2px;
        }

        .bon:focus-visible {
            outline: 3px solid var(--teal);
            outline-offset: 3px;
        }

        .amount {
            display: grid;
            grid-template-columns: 72px minmax(0, 1fr) 72px;
            gap: 6px;
            align-items: center;
            width: 100%;
            margin-top: 10px;
        }

        .side {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .step,
        .extra {
            border: 3px solid var(--purple);
            background: var(--peach);
            color: var(--purple);
            font: inherit;
            line-height: 1;
            cursor: pointer;
            touch-action: manipulation;
            text-decoration: none;
        }

        .step {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            font-size: 32px;
        }

        .extra {
            width: 100%;
            height: 36px;
            border-radius: 999px;
            font-size: 15px;
        }

        .step:active,
        .extra:active { transform: translateY(2px); }

        .medal {
            position: relative;
            width: min(100%, 128px);
            margin: 0 auto;
            aspect-ratio: 1;
        }

        .medal svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .medal label {
            position: absolute;
            inset: 16%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #bedrag {
            width: 100%;
            border: 0;
            padding: 0;
            background: transparent;
            color: var(--ink);
            font-family: Shrikhand, cursive;
            font-size: clamp(18px, 5.1vw, 26px);
            line-height: 1;
            text-align: center;
            text-decoration: none;
            -webkit-appearance: none;
            appearance: none;
        }

        #bedrag:focus { outline: none; }

        .mededeling {
            display: block;
            width: 100%;
            margin: 8px 0 0;
            border: 0;
            border-bottom: 2px dashed var(--purple);
            padding: 4px 8px 6px;
            background: transparent;
            color: var(--purple);
            font-family: "Trebuchet MS", sans-serif;
            font-size: 16px;
            font-weight: 700;
            line-height: 1.2;
            text-align: center;
            text-decoration: none;
            -webkit-appearance: none;
            appearance: none;
        }

        .hint {
            min-height: 1.1em;
            margin: 8px 0 0;
            color: var(--pink);
            font-family: "Trebuchet MS", sans-serif;
            font-size: 14px;
            font-weight: 700;
            text-align: center;
        }

        .qr-card {
            display: grid;
            width: min(100%, 248px);
            margin-top: 4px;
            padding: 8px;
            aspect-ratio: 1;
            background: #fff;
            border: 4px solid #5c3317;
            border-radius: 24px;
            box-shadow: 6px 6px 0 rgba(226, 24, 120, 0.18);
        }

        .qr-card canvas,
        .qr-empty {
            grid-area: 1 / 1;
        }

        .qr-card canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        .qr-empty {
            display: grid;
            place-items: center;
            margin: 0;
            padding: 12px;
            color: #8a6248;
            font-family: "Trebuchet MS", sans-serif;
            font-size: 16px;
            text-align: center;
        }

        .methode {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            width: 100%;
            margin-top: 12px;
        }

        .keuze {
            height: 48px;
            border: 3px solid var(--purple);
            border-radius: 999px;
            background: var(--peach);
            color: var(--purple);
            font: inherit;
            font-size: 18px;
            cursor: pointer;
            touch-action: manipulation;
        }

        .keuze[aria-pressed="true"] {
            background: var(--teal);
            color: #fffaf3;
            box-shadow: inset 0 3px 0 rgba(0, 0, 0, 0.15);
        }

        .keuze:focus-visible {
            outline: 3px solid var(--teal);
            outline-offset: 3px;
        }

        .cash {
            width: 100%;
            margin-top: 4px;
            padding: 12px 14px 14px;
            background: #fff;
            border: 4px solid #5c3317;
            border-radius: 24px;
            box-shadow: 6px 6px 0 rgba(226, 24, 120, 0.18);
        }

        .cash-rij {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 8px;
            margin: 0;
            font-size: 20px;
        }

        .cash-rij strong {
            font-family: Shrikhand, cursive;
            font-size: 28px;
            font-weight: 400;
        }

        .cash label {
            display: block;
            margin-top: 12px;
            font-size: 18px;
        }

        #gegeven {
            display: block;
            width: 100%;
            height: 52px;
            margin-top: 4px;
            border: 3px solid var(--purple);
            border-radius: 14px;
            padding: 0 12px;
            background: #fffaf3;
            color: var(--ink);
            font-family: Shrikhand, cursive;
            font-size: 26px;
            text-align: center;
            -webkit-appearance: none;
            appearance: none;
        }

        #gegeven:focus-visible {
            outline: 3px solid var(--teal);
            outline-offset: 2px;
        }

        .briefjes {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-top: 8px;
        }

        .briefjes button {
            height: 44px;
            border: 3px solid var(--purple);
            border-radius: 12px;
            background: var(--peach);
            color: var(--purple);
            font: inherit;
            font-size: 18px;
            cursor: pointer;
            touch-action: manipulation;
        }

        .briefjes button:active { transform: translateY(2px); }

        .terug {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 2px dashed var(--purple);
            color: var(--teal);
        }

        .terug.tekort { color: var(--pink); }

        .wacht {
            margin: 10px 0 0;
            color: #8a6248;
            font-family: "Trebuchet MS", sans-serif;
            font-size: 12px;
            text-align: center;
        }

        .pay {
            width: 100%;
            height: 64px;
            margin-top: 14px;
            border: 3px solid var(--purple);
            border-radius: 999px;
            background: linear-gradient(#ff7a2f, var(--orange));
            color: #fffaf3;
            font: inherit;
            font-size: 28px;
            letter-spacing: 0.04em;
            text-shadow: 0 2px 0 rgba(92, 42, 120, 0.35);
            box-shadow: 0 5px 0 var(--purple);
            cursor: pointer;
            touch-action: manipulation;
        }

        .pay:active:not(:disabled) {
            transform: translateY(3px);
            box-shadow: 0 2px 0 var(--purple);
        }

        .pay:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .pay:focus-visible,
        .step:focus-visible,
        .extra:focus-visible,
        #bedrag:focus-visible,
        #tekst:focus-visible {
            outline: 3px solid var(--teal);
            outline-offset: 3px;
        }

        .sr {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
        }
    </style>
</head>
<body>
    <main class="poster">
        <svg class="waves top" viewBox="0 0 400 90" preserveAspectRatio="none" aria-hidden="true">
            <path fill="#1a9b8e" d="M0 40 C 50 10, 80 70, 140 42 C 190 20, 220 8, 270 36 C 320 64, 350 20, 400 34 L400 0 L0 0 Z"/>
            <path fill="#e21878" d="M0 58 C 40 30, 90 78, 150 52 C 210 26, 240 18, 300 48 C 350 72, 370 40, 400 50 L400 0 L0 0 Z" opacity=".85"/>
            <path fill="#f15a12" d="M0 28 C 60 58, 100 8, 170 30 C 230 48, 260 70, 330 28 C 360 12, 380 24, 400 20 L400 0 L0 0 Z" opacity=".9"/>
        </svg>
        <svg class="waves bottom" viewBox="0 0 400 90" preserveAspectRatio="none" aria-hidden="true">
            <path fill="#7a3cff" d="M0 50 C 60 20, 110 80, 180 46 C 240 18, 280 24, 340 58 C 370 74, 390 40, 400 48 L400 0 L0 0 Z"/>
            <path fill="#1a9b8e" d="M0 34 C 50 64, 100 16, 160 40 C 230 68, 270 20, 340 42 C 370 54, 385 30, 400 36 L400 0 L0 0 Z"/>
            <path fill="#f15a12" d="M0 18 C 70 48, 120 4, 190 26 C 250 46, 300 8, 400 28 L400 0 L0 0 Z"/>
        </svg>
        <span class="star s1" aria-hidden="true">✦</span>
        <span class="star pink s2" aria-hidden="true">✦</span>
        <span class="star teal s3" aria-hidden="true">✦</span>
        <span class="star purple s4" aria-hidden="true">✦</span>
        <span class="star s5" aria-hidden="true">✦</span>

        <div class="sheet">
            <div class="ball" aria-hidden="true"></div>

            <div class="bonnen" aria-label="Bonnen toevoegen">
                <div class="bon-rij">
                    <button type="button" class="bon" data-cents="250" aria-label="1 blauwe bon, 2,50 euro erbij"><b>1</b><small>€2,50</small></button>
                    <button type="button" class="bon" data-cents="500" aria-label="2 blauwe bonnen, 5 euro erbij"><b>2</b><small>€5,00</small></button>
                    <button type="button" class="bon" data-cents="750" aria-label="3 blauwe bonnen, 7,50 euro erbij"><b>3</b><small>€7,50</small></button>
                    <button type="button" class="bon" data-cents="1000" aria-label="4 blauwe bonnen, 10 euro erbij"><b>4</b><small>€10,00</small></button>
                    <button type="button" class="bon" data-cents="1250" aria-label="5 blauwe bonnen, 12,50 euro erbij"><b>5</b><small>€12,50</small></button>
                </div>
                <div class="bon-rij">
                    <button type="button" class="bon rood" data-cents="375" aria-label="1 rode bon, 3,75 euro erbij"><b>1</b><small>€3,75</small></button>
                    <button type="button" class="bon rood" data-cents="750" aria-label="2 rode bonnen, 7,50 euro erbij"><b>2</b><small>€7,50</small></button>
                    <button type="button" class="bon rood" data-cents="1125" aria-label="3 rode bonnen, 11,25 euro erbij"><b>3</b><small>€11,25</small></button>
                    <button type="button" class="bon rood" data-cents="1500" aria-label="4 rode bonnen, 15 euro erbij"><b>4</b><small>€15,00</small></button>
                    <button type="button" class="bon rood" data-cents="1875" aria-label="5 rode bonnen, 18,75 euro erbij"><b>5</b><small>€18,75</small></button>
                </div>
            </div>

            <div class="amount">
                <div class="side">
                    <button type="button" class="step" id="down" aria-label="1,25 euro minder">−</button>
                    <button type="button" class="extra" id="reset">reset</button>
                </div>
                <div class="medal">
                    <svg viewBox="0 0 200 200" aria-hidden="true">
                        <g fill="#5c2a78">
                            <circle cx="100" cy="16" r="16"/>
                            <circle cx="142" cy="28" r="16"/>
                            <circle cx="172" cy="58" r="16"/>
                            <circle cx="184" cy="100" r="16"/>
                            <circle cx="172" cy="142" r="16"/>
                            <circle cx="142" cy="172" r="16"/>
                            <circle cx="100" cy="184" r="16"/>
                            <circle cx="58" cy="172" r="16"/>
                            <circle cx="28" cy="142" r="16"/>
                            <circle cx="16" cy="100" r="16"/>
                            <circle cx="28" cy="58" r="16"/>
                            <circle cx="58" cy="28" r="16"/>
                        </g>
                        <circle cx="100" cy="100" r="78" fill="#f6c9a4" stroke="#5c2a78" stroke-width="6"/>
                    </svg>
                    <label>
                        <input id="bedrag" inputmode="decimal" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" maxlength="12" aria-label="Bedrag in euro">
                    </label>
                </div>
                <div class="side">
                    <button type="button" class="step" id="up" aria-label="1,25 euro meer">+</button>
                    <button type="button" class="extra" id="plus15">€15</button>
                </div>
            </div>
            <input id="tekst" class="mededeling" maxlength="140" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Mededeling">
            <p class="hint" id="hint"></p>

            <div class="qr-card" id="qr-card">
                <canvas id="qr" role="img"></canvas>
                <p class="qr-empty" id="qr-empty" hidden>Vul een geldig bedrag in.</p>
            </div>

            <div class="cash" id="cash" hidden>
                <p class="cash-rij"><span>Te ontvangen</span><strong id="te-ontvangen">-</strong></p>
                <label for="gegeven">Klant geeft</label>
                <input id="gegeven" inputmode="decimal" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" maxlength="10" placeholder="€">
                <div class="briefjes">
                    <button type="button" data-cents="500">€5</button>
                    <button type="button" data-cents="1000">€10</button>
                    <button type="button" data-cents="2000">€20</button>
                    <button type="button" data-cents="5000">€50</button>
                </div>
                <p class="cash-rij terug" id="terug-rij"><span id="terug-label">Terug geven</span><strong id="terug">-</strong></p>
            </div>

            <div class="methode" role="group" aria-label="Betaalwijze">
                <button type="button" class="keuze" id="kies-qr" aria-pressed="true">Overschrijving</button>
                <button type="button" class="keuze" id="kies-cash" aria-pressed="false">Cash</button>
            </div>

            <button type="button" class="pay" id="betaald">Betaald</button>
            <p class="wacht" id="wacht" hidden></p>
        </div>
    </main>
    <p class="sr" id="status" aria-live="polite"></p>

    <script src="qrcode.js"></script>
    <script>
        // ===== INSTELLING: Google Spreadsheet =====
        // Plak hier de URL van de Google Apps Script web-app (eindigt op /exec).
        // Leeg laten = niets wordt verstuurd; betalingen wachten dan op deze telefoon
        // en worden alsnog verstuurd zodra hier een URL staat.
        const SHEET_URL = "";
        // ==========================================

        const NAME = "Jonas De Bot";
        const IBAN = "BE64734055410752";
        const BASIS = "Miekesfuif";
        const KEY = "miekesfuif-qr-v1";
        const STEP_CENTS = 125;
        const ADD_CENTS = 1500;
        const MAX_CENTS = 99999999;
        const QUEUE_KEY = "miekesfuif-log-v1";
        const QUEUE_MAX = 1000;
        const RESET_TAPS = 5;
        const RESET_GAP_MS = 1500;

        const bedrag = document.getElementById("bedrag");
        const tekst = document.getElementById("tekst");
        const hint = document.getElementById("hint");
        const canvas = document.getElementById("qr");
        const empty = document.getElementById("qr-empty");
        const betaald = document.getElementById("betaald");
        const status = document.getElementById("status");
        const qrCard = document.getElementById("qr-card");
        const cashBox = document.getElementById("cash");
        const teOntvangen = document.getElementById("te-ontvangen");
        const gegeven = document.getElementById("gegeven");
        const terug = document.getElementById("terug");
        const terugRij = document.getElementById("terug-rij");
        const terugLabel = document.getElementById("terug-label");
        const kiesQr = document.getElementById("kies-qr");
        const kiesCash = document.getElementById("kies-cash");
        const wacht = document.getElementById("wacht");

        qrcode.stringToBytes = function (text) {
            const bytes = [];
            for (const ch of text) {
                const code = ch.codePointAt(0);
                bytes.push(code <= 255 ? code : 63);
            }
            return bytes;
        };

        const state = load();
        let lockUntil = 0;
        let mode = "qr";
        let resetTaps = [];
        let notice = "";
        let noticeTimer = 0;
        let sending = false;

        bedrag.value = "-";
        tekst.value = state.note;
        render();
        document.fonts.ready.then(() => render());
        window.addEventListener("resize", () => fitAmount());

        bedrag.addEventListener("pointerdown", clearDash);
        bedrag.addEventListener("focus", () => {
            setTimeout(clearDash, 0);
        });

        bedrag.addEventListener("input", () => {
            render();
        });

        bedrag.addEventListener("blur", () => {
            const cents = parseAmount(bedrag.value);
            bedrag.value = cents == null ? "-" : formatCents(cents);
            render();
        });

        tekst.addEventListener("input", () => {
            state.note = tekst.value;
            save();
            render();
        });

        document.getElementById("down").addEventListener("click", () => step(-1));
        document.getElementById("up").addEventListener("click", () => step(1));
        document.getElementById("plus15").addEventListener("click", () => addCents(ADD_CENTS));
        document.getElementById("reset").addEventListener("click", resetAmount);

        document.querySelectorAll(".bon").forEach((knop) => {
            knop.addEventListener("click", () => addCents(Number(knop.dataset.cents)));
        });

        kiesQr.addEventListener("click", () => setMode("qr"));
        kiesCash.addEventListener("click", () => setMode("cash"));

        gegeven.addEventListener("input", () => render());
        gegeven.addEventListener("blur", () => {
            const cents = parseAmount(gegeven.value);
            if (cents != null) gegeven.value = formatCents(cents);
            render();
        });

        document.querySelectorAll(".briefjes button").forEach((knop) => {
            knop.addEventListener("click", () => {
                gegeven.value = formatCents(Number(knop.dataset.cents));
                render();
            });
        });

        window.addEventListener("online", flush);
        document.addEventListener("visibilitychange", () => {
            if (!document.hidden) flush();
        });
        setInterval(flush, 30000);
        flush();

        betaald.addEventListener("click", () => {
            const now = Date.now();
            if (now < lockUntil) return;
            const cents = parseAmount(bedrag.value);
            if (cents == null) return;
            const cash = cashInfo(cents);
            if (mode === "cash" && !cash.ok) return;
            lockUntil = now + 350;
            logPayment({
                id: now.toString(36) + "-" + Math.random().toString(36).slice(2, 8),
                ts: now,
                tijd: localTime(new Date(now)),
                mededeling: message(),
                bedrag: cents / 100,
                methode: mode === "cash" ? "Cash" : "Overschrijving",
                ontvangen: mode === "cash" ? cash.received / 100 : "",
                terug: mode === "cash" ? cash.change / 100 : "",
            });
            gegeven.value = "";
            mode = "qr";
            tekst.value = resetMessage();
            state.note = tekst.value;
            bedrag.value = "-";
            save();
            render();
            status.textContent = "Betaling genoteerd. Mededeling is nu " + state.note + ".";
        });

        function clearDash() {
            if (bedrag.value.trim() !== "-") return;
            bedrag.value = "";
            render();
        }

        function step(delta) {
            const current = parseAmount(bedrag.value);
            if (current == null) {
                bedrag.value = delta > 0 ? formatCents(STEP_CENTS) : "-";
            } else {
                const next = current + delta * STEP_CENTS;
                bedrag.value = next < 1 ? "-" : formatCents(Math.min(MAX_CENTS, next));
            }
            render();
        }

        function addCents(add) {
            const current = parseAmount(bedrag.value) || 0;
            bedrag.value = formatCents(Math.min(MAX_CENTS, current + add));
            render();
        }

        function resetAmount() {
            const now = Date.now();
            if (resetTaps.length && now - resetTaps[resetTaps.length - 1] > RESET_GAP_MS) resetTaps = [];
            resetTaps.push(now);
            bedrag.value = "-";
            gegeven.value = "";
            if (resetTaps.length >= RESET_TAPS) {
                resetTaps = [];
                state.next = 1;
                state.note = BASIS + " 1";
                tekst.value = state.note;
                save();
                flash("Teller terug op " + state.note);
            }
            render();
        }

        function setMode(next) {
            mode = next === "cash" ? "cash" : "qr";
            render();
        }

        function flash(text) {
            notice = text;
            status.textContent = text;
            clearTimeout(noticeTimer);
            noticeTimer = setTimeout(() => {
                notice = "";
                render();
            }, 2500);
        }

        function cashInfo(cents) {
            const raw = gegeven.value.trim();
            if (raw === "") return { ok: true, empty: true, received: cents, change: 0 };
            const received = parseAmount(raw);
            if (received == null) return { ok: false, invalid: true, received: 0, change: 0 };
            return { ok: received >= cents, received, change: received - cents };
        }

        function localTime(d) {
            const two = (n) => String(n).padStart(2, "0");
            return d.getFullYear() + "-" + two(d.getMonth() + 1) + "-" + two(d.getDate())
                + " " + two(d.getHours()) + ":" + two(d.getMinutes()) + ":" + two(d.getSeconds());
        }

        function readQueue() {
            try {
                const list = JSON.parse(localStorage.getItem(QUEUE_KEY) || "[]");
                return Array.isArray(list) ? list : [];
            } catch (error) {
                return [];
            }
        }

        function writeQueue(list) {
            try {
                localStorage.setItem(QUEUE_KEY, JSON.stringify(list.slice(-QUEUE_MAX)));
            } catch (error) {
                /* de kassa werkt ook zonder opslag */
            }
        }

        function logPayment(entry) {
            const list = readQueue();
            list.push(entry);
            writeQueue(list);
            setTimeout(flush, 0);
        }

        async function flush() {
            showQueue();
            if (sending || !SHEET_URL) return;
            sending = true;
            try {
                let list = readQueue();
                while (list.length) {
                    const entry = list[0];
                    await fetch(SHEET_URL, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify(entry),
                    });
                    list = readQueue().filter((item) => item.id !== entry.id);
                    writeQueue(list);
                }
            } catch (error) {
                /* geen netwerk: later opnieuw proberen */
            } finally {
                sending = false;
                showQueue();
            }
        }

        function showQueue() {
            const count = SHEET_URL ? readQueue().length : 0;
            wacht.hidden = count === 0;
            wacht.textContent = count === 1
                ? "1 betaling wacht nog om naar de lijst te gaan"
                : count + " betalingen wachten nog om naar de lijst te gaan";
        }

        function render() {
            const cents = parseAmount(bedrag.value);
            const valid = cents != null;
            const note = message();
            fitAmount();
            const raw = bedrag.value.trim();
            hint.textContent = valid || raw === "" || raw === "-"
                ? notice
                : "Gebruik een bedrag als 15,00.";
            const cash = mode === "cash";
            kiesQr.setAttribute("aria-pressed", String(!cash));
            kiesCash.setAttribute("aria-pressed", String(cash));
            qrCard.hidden = cash;
            cashBox.hidden = !cash;
            if (cash) {
                teOntvangen.textContent = valid ? "€" + formatCents(cents) : "-";
                const info = valid ? cashInfo(cents) : null;
                terugRij.classList.remove("tekort");
                terugLabel.textContent = "Terug geven";
                if (!info || info.empty) {
                    terug.textContent = "-";
                } else if (info.invalid) {
                    terug.textContent = "?";
                } else if (!info.ok) {
                    terugRij.classList.add("tekort");
                    terugLabel.textContent = "Nog tekort";
                    terug.textContent = "€" + formatCents(cents - info.received);
                } else {
                    terug.textContent = "€" + formatCents(info.change);
                }
                betaald.disabled = !valid || !info.ok;
                canvas.removeAttribute("aria-label");
                return;
            }
            betaald.disabled = !valid;
            canvas.hidden = !valid;
            empty.hidden = valid;
            if (!valid) {
                canvas.removeAttribute("aria-label");
                return;
            }
            draw(payload(cents, note));
            canvas.setAttribute("aria-label", "QR-code voor " + formatCents(cents) + " euro, mededeling " + note);
        }

        function fitAmount() {
            const sample = bedrag.value.trim() || "-";
            const width = bedrag.clientWidth;
            if (!width) return;
            const probe = canvas.getContext("2d");
            bedrag.style.fontSize = "";
            let size = parseFloat(getComputedStyle(bedrag).fontSize);
            probe.font = size + "px Shrikhand, cursive";
            while (size > 13 && probe.measureText(sample).width > width - 4) {
                size -= 1;
                probe.font = size + "px Shrikhand, cursive";
            }
            bedrag.style.fontSize = size + "px";
        }

        function message() {
            let out = "";
            for (const ch of tekst.value.replace(/[\r\n]+/g, " ")) {
                const code = ch.codePointAt(0);
                out += code >= 32 && code <= 255 ? ch : " ";
            }
            return out.trim().slice(0, 140);
        }

        function resetMessage() {
            const match = message().match(/(\d+)\s*$/);
            const n = match && match[1].length < 10 ? Number(match[1]) + 1 : state.next + 1;
            state.next = n;
            return BASIS + " " + n;
        }

        function payload(cents, note) {
            return [
                "BCD",
                "002",
                "2",
                "SCT",
                "",
                NAME,
                IBAN,
                epcAmount(cents),
                "",
                "",
                note,
            ].join("\n") + "\n";
        }

        function epcAmount(cents) {
            const euros = Math.floor(cents / 100);
            const rem = String(cents % 100).padStart(2, "0");
            return "EUR" + euros + "." + rem;
        }

        function draw(text) {
            const qr = qrcode(0, "M");
            qr.addData(text, "Byte");
            qr.make();
            const modules = qr.getModuleCount();
            const quiet = 4;
            const scale = 8;
            const size = (modules + quiet * 2) * scale;
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext("2d");
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, size, size);
            ctx.fillStyle = "#000000";
            for (let row = 0; row < modules; row += 1) {
                for (let col = 0; col < modules; col += 1) {
                    if (qr.isDark(row, col)) {
                        ctx.fillRect((col + quiet) * scale, (row + quiet) * scale, scale, scale);
                    }
                }
            }
        }

        function parseAmount(raw) {
            const source = String(raw).trim().replace(/\s/g, "").replace("€", "").replace(",", ".");
            if (!/^\d+(\.\d{0,2})?$/.test(source)) return null;
            const cents = Math.round(Number(source) * 100);
            if (!Number.isFinite(cents) || cents < 1 || cents > MAX_CENTS) return null;
            return cents;
        }

        function formatCents(cents) {
            const euros = Math.floor(cents / 100);
            const rem = String(cents % 100).padStart(2, "0");
            return euros + "," + rem;
        }

        function load() {
            const fresh = { next: 1, note: BASIS + " 1" };
            try {
                const saved = JSON.parse(localStorage.getItem(KEY) || "null");
                if (!saved) return fresh;
                const next = Number.isInteger(saved.next) && saved.next >= 1 ? saved.next : 1;
                const note = typeof saved.note === "string" && saved.note.trim()
                    ? saved.note.replace(/[\r\n]+/g, " ").trim().slice(0, 140)
                    : BASIS + " " + next;
                return { next, note };
            } catch (error) {
                /* lege start als de browser geen opslag geeft */
            }
            return fresh;
        }

        function save() {
            try {
                localStorage.setItem(KEY, JSON.stringify(state));
            } catch (error) {
                /* de pagina werkt ook zonder opslag */
            }
        }
    </script>
</body>
</html>
